<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Clock face ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#cbd5e1" stroke-width="5"/>

  <!-- Ticks (12, 3, 6, 9) -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="24" x2="64" y2="32"/>
    <line x1="104" y1="64" x2="96" y2="64"/>
    <line x1="64" y1="104" x2="64" y2="96"/>
    <line x1="24" y1="64" x2="32" y2="64"/>
  </g>

  <!-- Hour hand: pointing at ~10 (forms the top-left of an 'L' moment) -->
  <line x1="64" y1="64" x2="44" y2="46" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

  <!-- Minute hand: pointing down-left, paired to read as an 'L' with hour hand -->
  <line x1="64" y1="64" x2="42" y2="80" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
</svg>
