<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128">
  <!-- LucClock wordmark lockup (light background variant) -->

  <!-- Mark: rounded tile with L-hands clock -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#cbd5e1" stroke-width="5"/>
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="24" x2="64" y2="32"/>
    <line x1="104" y1="64" x2="96" y2="64"/>
    <line x1="64" y1="104" x2="64" y2="96"/>
    <line x1="24" y1="64" x2="32" y2="64"/>
  </g>
  <line x1="64" y1="64" x2="44" y2="46" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="42" y2="80" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="150" y="78" font-size="58" font-weight="700" fill="#1e293b" letter-spacing="-1">
      Luc<tspan fill="#3b82f6">Clock</tspan>
    </text>
    <text x="152" y="106" font-size="17" fill="#64748b" letter-spacing="2.5">
      FLOATING CLOCK &amp; TIMERS
    </text>
    <text x="152" y="8" font-size="14" fill="#94a3b8" letter-spacing="3">
      BY LUCAS
    </text>
  </g>
</svg>
