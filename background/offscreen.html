<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <audio id="chime" src="chime.wav" preload="auto"></audio>
    <script>
      chrome.runtime.onMessage.addListener((message, _sender, sendResponse) => {
        if (message && message.type === "chime:play") {
          const audio = document.getElementById("chime");
          if (audio) {
            audio.currentTime = 0;
            const p = audio.play();
            if (p && p.catch) p.catch(() => {});
          }
          sendResponse({ ok: true });
        }
      });
    </script>
  </body>
</html>
